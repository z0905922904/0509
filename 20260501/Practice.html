<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>MindAR Example</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        a-scene {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 隱藏所有 MindAR 預設 UI */
        .mindar-ui-loading,
        .mindar-ui-error,
        .mindar-ui-scanning {
            display: none;
        }

        /* 自訂文字的外層 DIV */
        #custom-text {
            display: none; /* 預設隱藏 */
            position: fixed;
            top: 20px; /* 距離頂部 20px */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 0.5em 1em;
            font-size: 1.5em;
            border-radius: 0.3em;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- 1. HTML 裡先放一個自訂的 DIV -->
    <div id="custom-text">大河馬大嘴巴</div>

    <!-- 你的 AR 場景 -->
    <!-- 確認檔名為 targets.mind -->
    <a-scene
        mindar-image="
            imageTargetSrc: Kobe.mind;
            autoStart: true;
            showStats: false;
            uiLoading: no;
            uiScanning: no;
            uiError: no;
        "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >
        <!-- 設定 AR 相機位置與原點，並關閉滑鼠/手勢控制 -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 定義 target，之後用 JS 綁定事件 -->
        <a-entity mindar-image-target="targetIndex: 0" id="target"></a-entity>
    </a-scene>

    <!-- 3. 用 JS 綁事件：掃到 target 時顯示 DIV，掉失時隱藏 -->
    <script>
        // 等整個頁面（DOM、資源）載入完成後再執行
        window.addEventListener("load", () => {

            // 2. 取得 AR 目標元素
            const targetEl = document.querySelector("#target");

            // 3. 取得文字容器
            const customDiv = document.querySelector("#custom-text");

            // 4. 綁定「掃描到目標」事件
            targetEl.addEventListener("targetFound", () => {
                customDiv.style.display = "block";
            });

            // 5. 綁定「目標遺失」事件
            targetEl.addEventListener("targetLost", () => {
                customDiv.style.display = "none";
            });

        });
    </script>
</body>
</html>
